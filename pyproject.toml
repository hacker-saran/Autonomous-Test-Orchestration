[project]
name = "orchestrator"
version = "0.1.0"
description = "Autonomous Test Orchestration Agent (hackathon boilerplate)"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.45",
    "pydantic>=2.7",
    "openai>=1.40",
    "python-dotenv>=1.0",
    "pytest>=8.0",
    "pytest-playwright>=0.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["orchestrator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# TestPlan/GeneratedTest etc. are Pydantic models, not pytest test classes.
filterwarnings = ["ignore::pytest.PytestCollectionWarning"]
